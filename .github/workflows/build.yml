name: Compilar vitrine.nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SDL2 para Switch
        run: dkp-pacman -Sy --needed --noconfirm switch-sdl2 switch-sdl2_image switch-pkg-config || true

      - name: Compilar
        run: make

      - name: Montar pasta para o cartão SD
        run: |
          mkdir -p sd/switch/vitrine/fotos
          cp vitrine.nro sd/switch/vitrine/
          cp LEIAME.txt sd/switch/vitrine/fotos/COLOQUE-AS-FOTOS-AQUI.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-switch-sd
          path: sd
